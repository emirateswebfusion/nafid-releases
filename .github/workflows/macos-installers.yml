name: macOS installers (validation only)
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Require Developer ID signing and Apple notarization (credentials must already exist)
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/macos-installers.yml'
      - 'tests/packaged/macos-*'
      - 'scripts/merge-macos-metadata.cjs'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VITE_CLOUD_API: https://nafid-eta.vercel.app
      VENDORA_CLOUD_API: https://nafid-eta.vercel.app
      VENDORA_SYNC_INTERVAL_MINUTES: '2.0'
      ALLOWED_CONNECT_ORIGINS: https://nafid-server.vercel.app,https://nafid.vercel.app,https://vendora-server.vercel.app,https://vendora-server-ruby.vercel.app,https://clients3.google.com,https://nafid-web-portal.vercel.app,https://nafid.emirateswebfusion.com
      UPDATES_REPO_URL: https://github.com/emirateswebfusion/nafid-releases
      MAC_SIGNED_RELEASE: ${{ inputs.signed && 'true' || 'false' }}
      CSC_LINK: ${{ inputs.signed && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      MAC_APPLE_API_KEY_B64: ${{ inputs.signed && secrets.MAC_APPLE_API_KEY || '' }}
      APPLE_API_KEY_ID: ${{ inputs.signed && secrets.MAC_APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ inputs.signed && secrets.MAC_APPLE_API_ISSUER || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Check signing prerequisites
        shell: bash
        run: |
          if [[ "$MAC_SIGNED_RELEASE" == true ]]; then
            for name in CSC_LINK CSC_KEY_PASSWORD MAC_APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              [[ -n "${!name}" ]] || { echo "Missing required signing credential: $name"; exit 1; }
            done
          fi
      - name: Prepare notarization key
        if: inputs.signed
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'nafid-notarization.p8')
          key = base64.b64decode(os.environ['MAC_APPLE_API_KEY_B64'], validate=True)
          if b'BEGIN PRIVATE KEY' not in key:
              raise ValueError('Notarization key must contain a base64 encoded p8 private key')
          with open(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as file:
              file.write(key)
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('APPLE_API_KEY=' + path + '\n')
          PY
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare native Mac runtime
        run: node scripts/prepare-macos-runtime.cjs '${{ matrix.arch }}'
      - run: pnpm run build
      - name: Build installers without publishing
        shell: bash
        run: |
          if [[ "$MAC_SIGNED_RELEASE" == true ]]; then
            pnpm exec electron-builder --config electron-builder.config.js --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true -c.mac.notarize=true
          else
            env -u CSC_LINK -u CSC_KEY_PASSWORD -u APPLE_API_KEY -u APPLE_API_KEY_ID -u APPLE_API_ISSUER CSC_FOR_PULL_REQUEST=true CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --config electron-builder.config.js --mac --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.notarize=false
          fi
      - name: Verify final DMG, native modules, and app startup
        run: node tests/packaged/macos-installer.cjs release '${{ matrix.arch }}'
      - name: Remove temporary notarization key
        if: always() && inputs.signed
        shell: bash
        run: python3 -c "import os; p = os.path.join(os.environ['RUNNER_TEMP'], 'nafid-notarization.p8'); os.path.exists(p) and os.remove(p)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/verification/*.json
            release/verification/*.log
  metadata:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-build-*
          path: macos-artifacts
      - run: node scripts/merge-macos-metadata.cjs macos-artifacts release-macos-metadata
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-metadata
          retention-days: 7
          path: release-macos-metadata/*
